name: CI

# Keep this trigger when creating a project from the template.
# Change it only for an explicit user request or a demonstrated project requirement.
# Do not replace main-push publication with tag or release triggers.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@main
        with:
          dev-shell: ci
      - name: Regenerate integration fixtures
        shell: bash
        run: |
          eval "$(nix print-dev-env .#ci)"
          serde-gen --package src/test/serde
          serde-gen --package src/test/validation
          moon fmt src/test/serde src/test/validation
          git diff --exit-code -- src/test/serde/serde.generated.mbt src/test/validation/serde.generated.mbt
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@main
        with:
          dev-shell: ci
