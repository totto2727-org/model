name: CI

# Keep this trigger when creating a project from the template.
# Change it only for an explicit user request or a demonstrated project requirement.
# Do not replace main-push publication with tag or release triggers.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@main
        with:
          dev-shell: ci
      - name: Install native serde-gen
        shell: bash
        run: |
          nix develop .#ci --command moon install ./src/cmd/serde-gen --bin "$RUNNER_TEMP/serde-bin"
          test -x "$RUNNER_TEMP/serde-bin/serde-gen"
          echo "$RUNNER_TEMP/serde-bin" >> "$GITHUB_PATH"
      - name: Test the generator CLI
        run: sh src/cmd/serde-gen/cli_test.sh
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@main
        with:
          dev-shell: ci
